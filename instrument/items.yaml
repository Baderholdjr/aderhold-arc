instrument:
  name: Aderhold A.R.C. Pulse Survey
  version: 1.1.0
  scale:
    min: 1
    max: 5
    labels:
    - Strongly disagree
    - Disagree
    - Neither agree nor disagree
    - Agree
    - Strongly agree
scoring:
  severity:
  - below: 40
    label: Critical
  - below: 60
    label: Significant
  - below: 75
    label: Moderate
  - below: 101
    label: Healthy
  maturity:
  - below: 20
    level: 1
    name: Imposed
  - below: 40
    level: 2
    name: Tolerated
  - below: 60
    level: 3
    name: Adopted
  - below: 80
    level: 4
    name: Calibrated
  - below: 101
    level: 5
    name: Integrated
  perception_gap_points: 15
  min_group_size: 5
  groups:
    IC:
    - IC
    Leaders:
    - MGR
    - SL
  leader_min_group_size: 3
pillars:
- name: Acceptance
  question: Will people engage with AI, willingly?
- name: Reliance
  question: Do people trust AI the right amount?
- name: Collaboration
  question: Has the work been reorganized around human-AI teaming?
- name: Foundation
  question: Are the rules on blame, override and measurement fair and explicit?
dimensions:
- code: A1
  name: Purpose & narrative clarity
  pillar: Acceptance
  items:
  - id: A1.1
    text: Leadership has clearly explained why our organization is adopting AI.
    reverse: false
    leader_text: Our people would say leadership has clearly explained why we are adopting AI.
  - id: A1.2
    text: I understand how AI is meant to change my work over the next year.
    reverse: false
    leader_text: Our people understand how AI is meant to change their work over the next year.
  - id: A1.3
    text: The message I hear about AI is about helping people do better work, not just cutting costs.
    reverse: false
    leader_text: Our message about AI is about helping people do better work, not just cutting costs.
- code: A2
  name: Role security & psychological safety
  pillar: Acceptance
  items:
  - id: A2.1
    text: I feel safe admitting when I don't know how to use an AI tool.
    reverse: false
    leader_text: People here feel safe admitting when they don't know how to use an AI tool.
  - id: A2.2
    text: I worry that AI will be used to replace my role.
    reverse: true
    leader_text: People here worry that AI will be used to replace their roles.
  - id: A2.3
    text: I can raise concerns about AI tools without it hurting how I'm seen.
    reverse: false
    leader_text: People can raise concerns about AI tools without it hurting how they are seen.
- code: A3
  name: Onboarding & enablement
  pillar: Acceptance
  items:
  - id: A3.1
    text: I received training on our AI tools that was specific to my role.
    reverse: false
    leader_text: Our people have received AI training that is specific to their roles.
  - id: A3.2
    text: I have had to learn our AI tools mostly on my own time.
    reverse: true
    leader_text: Our people have had to learn our AI tools mostly on their own time.
  - id: A3.3
    text: I know where to go for help when I get stuck using an AI tool.
    reverse: false
    leader_text: Our people know where to go for help when they get stuck with an AI tool.
- code: A4
  name: Demonstrated value
  pillar: Acceptance
  items:
  - id: A4.1
    text: AI tools have made a real difference on at least one task I care about.
    reverse: false
    leader_text: AI tools have made a real difference on tasks our people care about.
  - id: A4.2
    text: I have seen concrete examples of colleagues getting good results with AI.
    reverse: false
    leader_text: Our people have seen concrete examples of colleagues getting good results with AI.
  - id: A4.3
    text: The AI tools we have been given fit the work I actually do.
    reverse: false
    leader_text: The AI tools we have provided fit the work our people actually do.
- code: R1
  name: Explainability & transparency
  pillar: Reliance
  items:
  - id: R1.1
    text: Our AI tools show enough reasoning or sources for me to judge their outputs.
    reverse: false
    leader_text: Our AI tools show enough reasoning or sources for people to judge their outputs.
  - id: R1.2
    text: When an AI tool gives an answer, I can usually tell how it got there.
    reverse: false
    leader_text: When an AI tool gives an answer, our people can usually tell how it got there.
  - id: R1.3
    text: I am often expected to act on AI outputs I couldn't explain to someone else.
    reverse: true
    leader_text: Our people are often expected to act on AI outputs they couldn't explain to someone else.
- code: R2
  name: Trust calibration
  pillar: Reliance
  items:
  - id: R2.1
    text: I know which tasks our AI tools are reliable for and which they are not.
    reverse: false
    leader_text: Our people know which tasks our AI tools are reliable for and which they are not.
  - id: R2.2
    text: I have been taught the common ways our AI tools make mistakes.
    reverse: false
    leader_text: Our people have been taught the common ways our AI tools make mistakes.
  - id: R2.3
    text: I trust AI outputs about the right amount, neither too much nor too little.
    reverse: false
    leader_text: Our people trust AI outputs about the right amount, neither too much nor too little.
- code: R3
  name: Verification practice
  pillar: Reliance
  items:
  - id: R3.1
    text: There are clear guidelines for how carefully to check AI outputs, based on the risk of the task.
    reverse: false
    leader_text: We have clear guidelines for how carefully to check AI outputs, based on the risk of the task.
  - id: R3.2
    text: I often end up redoing AI work from scratch because I don't trust it.
    reverse: true
    leader_text: Our people often redo AI work from scratch because they don't trust it.
  - id: R3.3
    text: I sometimes accept AI outputs without checking because of time pressure.
    reverse: true
    leader_text: Our people sometimes accept AI outputs without checking because of time pressure.
- code: R4
  name: Failure response ("flop protocol")
  pillar: Reliance
  items:
  - id: R4.1
    text: When an AI tool makes a significant mistake, there is a clear way to report it.
    reverse: false
    leader_text: When an AI tool makes a significant mistake, there is a clear way to report it.
  - id: R4.2
    text: After AI errors, we learn what went wrong and what to watch for.
    reverse: false
    leader_text: After AI errors, we learn what went wrong and what to watch for.
  - id: R4.3
    text: One bad AI mistake has made me stop trusting a tool I used to rely on.
    reverse: true
    leader_text: A single bad AI mistake has made people stop trusting a tool they used to rely on.
- code: C1
  name: Workflow & role redesign
  pillar: Collaboration
  items:
  - id: C1.1
    text: Our workflows have been redesigned to make use of AI, not just had AI added on top.
    reverse: false
    leader_text: Our workflows have been redesigned to make use of AI, not just had AI added on top.
  - id: C1.2
    text: My role and responsibilities have been updated to reflect how AI is used.
    reverse: false
    leader_text: Roles and responsibilities have been updated to reflect how AI is used.
  - id: C1.3
    text: Time saved by AI is redirected to higher-value work.
    reverse: false
    leader_text: Time saved by AI is redirected to higher-value work.
- code: C2
  name: AI direction competency
  pillar: Collaboration
  items:
  - id: C2.1
    text: I am confident giving AI tools clear instructions that get useful results.
    reverse: false
    leader_text: Our people are confident giving AI tools clear instructions that get useful results.
  - id: C2.2
    text: The AI training I receive matches my experience level.
    reverse: false
    leader_text: The AI training we provide matches each person's experience level.
  - id: C2.3
    text: Skill in working with AI is developed, recognized and rewarded here.
    reverse: false
    leader_text: Skill in working with AI is developed, recognized and rewarded here.
- code: C3
  name: Teaming norms
  pillar: Collaboration
  items:
  - id: C3.1
    text: My team has agreed norms for when and how we use AI.
    reverse: false
    leader_text: Our teams have agreed norms for when and how they use AI.
  - id: C3.2
    text: People on my team can see AI differently (as a partner or as a tool) and still work well together.
    reverse: false
    leader_text: People who see AI differently (as a partner or as a tool) still work well together here.
  - id: C3.3
    text: It is clear which parts of our work belong to people and which to AI.
    reverse: false
    leader_text: It is clear which parts of our work belong to people and which to AI.
- code: C4
  name: Expertise pipeline
  pillar: Collaboration
  items:
  - id: C4.1
    text: Newer staff still get the practice they need to build real expertise.
    reverse: false
    leader_text: Newer staff still get the practice they need to build real expertise.
  - id: C4.2
    text: I worry that relying on AI is eroding important skills on my team.
    reverse: true
    leader_text: I worry that relying on AI is eroding important skills in our teams.
  - id: C4.3
    text: There is a plan for how people will build expertise as AI takes over routine tasks.
    reverse: false
    leader_text: We have a plan for how people will build expertise as AI takes over routine tasks.
- code: F1
  name: Accountability model
  pillar: Foundation
  items:
  - id: F1.1
    text: I am judged on whether I used good judgment and checks, not on errors the AI makes on its own.
    reverse: false
    leader_text: We judge people on whether they used good judgment and checks, not on errors the AI makes on its own.
  - id: F1.2
    text: If an AI-assisted decision goes wrong, I expect to take the blame alone.
    reverse: true
    leader_text: If an AI-assisted decision goes wrong, the employee involved would take the blame alone.
  - id: F1.3
    text: It is clear who is accountable for decisions made with AI.
    reverse: false
    leader_text: It is clear who is accountable for decisions made with AI.
- code: F2
  name: Right to override
  pillar: Foundation
  items:
  - id: F2.1
    text: I have clear authority to overrule an AI recommendation.
    reverse: false
    leader_text: Our people have clear authority to overrule an AI recommendation.
  - id: F2.2
    text: I have felt pressure to go along with an AI output I disagreed with.
    reverse: true
    leader_text: Our people feel pressure to go along with AI outputs they disagree with.
  - id: F2.3
    text: My manager supports me when I override an AI tool for good reason.
    reverse: false
    leader_text: Managers here support people who override an AI tool for good reason.
- code: F3
  name: Human-AI measurement
  pillar: Foundation
  items:
  - id: F3.1
    text: We track whether AI tools are actually being used and actually helping.
    reverse: false
    leader_text: We track whether AI tools are actually being used and actually helping.
  - id: F3.2
    text: Our performance measures reward the quality of human judgment, not just speed.
    reverse: false
    leader_text: Our performance measures reward the quality of human judgment, not just speed.
  - id: F3.3
    text: Feedback from people using AI is used to improve the tools or how we use them.
    reverse: false
    leader_text: Feedback from people using AI is used to improve the tools or how we use them.
behavioral:
- id: B1
  key: use_freq
  text: How often do you use the organization's AI tools for work?
  options:
  - label: Never
    value: 1
  - label: Monthly or less
    value: 2
  - label: Weekly
    value: 3
  - label: Several times a week
    value: 4
  - label: Daily
    value: 5
- id: B2
  key: depth
  text: For tasks AI could help with, roughly what share do you use it for?
  options:
  - label: None
    value: 0
  - label: About 25%
    value: 0.25
  - label: About half
    value: 0.5
  - label: About 75%
    value: 0.75
  - label: All of them
    value: 1
- id: B3
  key: verify_share
  text: Of the time AI saves you, how much goes to re-checking or redoing its work?
  options:
  - label: None
    value: 0
  - label: About 25%
    value: 0.25
  - label: About half
    value: 0.5
  - label: About 75%
    value: 0.75
  - label: All of it
    value: 1
- id: B4
  key: error_seen
  text: In the last 90 days, have you seen an AI error reach a customer, a decision or a final output?
  options:
  - label: 'Yes'
    value: 1
  - label: 'No'
    value: 0
  - label: Not sure
    value: null
- id: B5
  key: train_hrs
  text: Hours of AI training received in the last 12 months
  options:
  - label: '0'
    value: 0
  - label: 1-2
    value: 1.5
  - label: 3-4
    value: 3.5
  - label: 5-9
    value: 7
  - label: 10+
    value: 12
- id: B6
  key: own_time_hrs
  text: Hours spent learning AI tools on personal time in the last 3 months
  options:
  - label: '0'
    value: 0
  - label: 1-5
    value: 3
  - label: 6-10
    value: 8
  - label: 11-20
    value: 15
  - label: 20+
    value: 25
- id: B7
  key: shadow_ai
  text: In the last 30 days, have you used AI tools not approved by the organization?
  options:
  - label: 'Yes'
    value: 1
  - label: 'No'
    value: 0
  - label: Prefer not to say
    value: null
- id: B8
  key: role
  text: Your role
  options:
  - label: Individual contributor
    value: IC
  - label: People manager
    value: MGR
  - label: Senior leader
    value: SL
  staff_only: true
open_question: What one change would make AI most useful in your work?
waves:
- id: T1
  name: Baseline
  when: Before implementation starts
  modules:
  - core
- id: T2
  name: Midpoint
  when: About 6-10 weeks into implementation
  modules:
  - core
  - exposure
- id: T3
  name: Follow-up
  when: 3-6 months after implementation ends
  modules:
  - core
  - exposure
  - change
audiences:
- id: staff
  name: Staff survey
  min_group_size: 5
- id: leader
  name: Leadership survey
  min_group_size: 3
change_rules:
  min_points: 5
  alpha: 0.05
  exposure_reach_threshold: 0.5
  leader_staff_gap_points: 15
exposure:
  scale:
  - label: 'Yes'
    value: 1
  - label: 'No'
    value: 0
  - label: Not sure
    value: null
  items:
  - id: X.M1
    module: M1
    targets:
    - A1
    - A2
    text: Leadership has recently explained why we're using AI and what it means for our jobs.
    leader_text: I have recently explained to my teams why we're using AI and what it means for their jobs.
  - id: X.M2
    module: M2
    targets:
    - A2
    - A3
    - F2
    text: My manager has coached me or my team on using AI tools.
    leader_text: Managers in my area have been coaching their teams on using AI tools.
  - id: X.M3
    module: M3
    targets:
    - A3
    - A4
    text: I received role-specific AI training during work time.
    leader_text: My teams received role-specific AI training during work time.
  - id: X.M4
    module: M4
    targets:
    - A4
    - C1
    text: My team took part in a session to find good uses for AI in our work.
    leader_text: My teams took part in sessions to find good uses for AI in their work.
  - id: X.M5
    module: M5
    targets:
    - R1
    - R2
    text: I've been shown where our AI tools are reliable and where they make mistakes.
    leader_text: My teams have been shown where our AI tools are reliable and where they make mistakes.
  - id: X.M6
    module: M6
    targets:
    - R3
    - F2
    text: I've been given clear rules on how carefully to check AI outputs for different kinds of tasks.
    leader_text: My teams have clear rules on how carefully to check AI outputs for different kinds of tasks.
  - id: X.M7
    module: M7
    targets:
    - R4
    - F3
    text: I know how to report an AI error, and I've seen errors followed up.
    leader_text: We have a working process for reporting AI errors, and errors are followed up.
  - id: X.M8
    module: M8
    targets:
    - C2
    text: I've had training on giving AI instructions and checking its work, at my level.
    leader_text: My teams have had leveled training on giving AI instructions and checking its work.
  - id: X.M9
    module: M9
    targets:
    - C1
    - C3
    text: At least one of my team's workflows was redesigned around AI.
    leader_text: At least one workflow in my area was redesigned around AI.
  - id: X.M10
    module: M10
    targets:
    - C4
    text: There's a structured way for newer staff to build expertise alongside AI.
    leader_text: We have put a structured way in place for newer staff to build expertise alongside AI.
  - id: X.M11
    module: M11
    targets:
    - F1
    - F2
    - F3
    text: Leadership has changed policy on accountability for AI errors or the right to override AI.
    leader_text: We have changed policy on accountability for AI errors or the right to override AI.
  - id: X.M12
    module: M12
    targets:
    - R1
    text: Our AI tools now show their reasoning or sources more clearly.
    leader_text: Our AI tools now show their reasoning or sources more clearly.
change:
  prompt: Compared with when this program started, how has each of these changed for you?
  leader_prompt: Compared with when this program started, how has each of these changed in your organization?
  scale:
  - label: Much worse
    value: -2
  - label: Worse
    value: -1
  - label: About the same
    value: 0
  - label: Better
    value: 1
  - label: Much better
    value: 2
  items:
  - id: P1
    pillar: Acceptance
    text: How useful AI tools are in my work
    leader_text: How useful AI tools are in our people's work
  - id: P2
    pillar: Reliance
    text: How well I can judge when to trust AI outputs
    leader_text: How well our people judge when to trust AI outputs
  - id: P3
    pillar: Collaboration
    text: How well my team's work is organized around AI
    leader_text: How well our teams' work is organized around AI
  - id: P4
    pillar: Foundation
    text: How safe I feel questioning or overriding AI
    leader_text: How safe people feel questioning or overriding AI
  - id: P5
    pillar: Overall
    text: How manageable my AI-related workload and stress feel
    leader_text: How manageable AI-related workload and stress feel for our people
leadership:
  items:
  - id: L1
    text: Our organization has a written AI strategy with measurable goals.
    type: likert
  - id: L2
    text: I know what return we expect from our AI investments, and by when.
    type: likert
  - id: L3
    text: I am prepared to change policy so people are not blamed for errors the AI makes on its own.
    type: likert
  - id: L4
    text: I am prepared to formally protect employees' right to override AI.
    type: likert
  - id: L5
    text: We are funding AI training at the level the rollout needs.
    type: likert
  - id: L6
    text: Leaders here model good AI use themselves.
    type: likert
  - id: L7
    text: When do you expect our AI investment to pay for itself?
    type: choice
    options:
    - label: Under 6 months
      value: 1
    - label: 6-12 months
      value: 2
    - label: 1-2 years
      value: 3
    - label: More than 2 years
      value: 4
    - label: Don't know
      value: null
  open_question: What worries you most about AI in your organization?
